services:
  uvr-worker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /models
      MAX_UPLOAD_MB: "250"
      MAX_CONCURRENT_JOBS: "1"
      UVR_WORKER_SECRET: ${UVR_WORKER_SECRET:?set UVR_WORKER_SECRET in .env}
    volumes:
      - uvr_models:/models
    restart: unless-stopped
    gpus: all
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  uvr_models:
