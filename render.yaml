services:
  - type: web
    name: artistyar-website
    runtime: node
    branch: main
    # Install → build → stage standalone (faster cold start)
    buildCommand: >
      npm ci --no-audit --no-fund &&
      NEXT_TELEMETRY_DISABLED=1 npm run build &&
      cp -r public .next/standalone/public &&
      cp -r .next/static .next/standalone/.next/static
    # Bind all interfaces; PORT is injected by Render (default 10000)
    startCommand: node .next/standalone/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=1536"
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"

  - type: cron
    name: artistyar-telegram-plugin-processor
    runtime: node
    branch: main
    buildCommand: npm ci --no-audit --no-fund
    startCommand: node scripts/process-telegram-plugins.mjs
    schedule: "*/2 * * * *"
    envVars:
      - key: TELEGRAM_PLUGIN_PROCESS_URL
        fromService:
          name: artistyar-website
          type: web
          property: hostport
      - key: WEB_ADMIN_API_KEY
        fromService:
          name: artistyar-website
          type: web
          envVarKey: WEB_ADMIN_API_KEY
