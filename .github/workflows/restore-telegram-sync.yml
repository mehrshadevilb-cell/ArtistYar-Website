name: restore-telegram-sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/tg-sync.zlib.b64.*"
      - "scripts/assemble-tg-sync.mjs"
      - ".github/workflows/restore-telegram-sync.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assemble telegram-plugin-sync
        run: node scripts/assemble-tg-sync.mjs
      - name: Verify full source
        run: |
          SIZE=$(wc -c < src/lib/telegram-plugin-sync.ts)
          echo "size=$SIZE"
          test "$SIZE" -gt 20000
          grep -q enqueuePluginMessage src/lib/telegram-plugin-sync.ts
          grep -q processPendingPluginPairs src/lib/telegram-plugin-sync.ts
          ! grep -q PLACEHOLDER_WILL_REPLACE src/lib/telegram-plugin-sync.ts
          ! grep -q "not assembled" src/lib/telegram-plugin-sync.ts
          ! grep -q PLACEHOLDER_TO_REPLACE src/lib/telegram-plugin-sync.ts
      - name: Commit assembled source if needed
        run: |
          git config user.name "artistyar-bot"
          git config user.email "bot@artistyar.ir"
          git add src/lib/telegram-plugin-sync.ts
          if git diff --staged --quiet; then
            echo "Already complete on disk after assemble"
            # still check size of committed tree file
            SIZE=$(wc -c < src/lib/telegram-plugin-sync.ts)
            echo "working tree size=$SIZE"
          else
            git commit -m "fix(day5-gate): commit full telegram-plugin-sync source"
            git push origin HEAD
          fi
