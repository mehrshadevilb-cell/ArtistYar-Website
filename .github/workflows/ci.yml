name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install · Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (non-interactive)
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

      - name: Source scan
        run: node scripts/scan-codebase.js

      - name: Production build
        run: npm run build

      - name: Verify standalone server artifact
        run: test -f .next/standalone/server.js

      - name: Production dependency audit (informational)
        run: npm audit --omit=dev || true

      - name: Live SEO endpoint contracts
        run: npm run seo:verify
        env:
          SEO_EXPECTED_SITE_URL: https://artistyaar.ir
