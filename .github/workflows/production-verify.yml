name: Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: production-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-

      - name: Typecheck
        run: npm run typecheck

      - name: Source scan
        run: node scripts/scan-codebase.js

      - name: Production build
        run: NEXT_TELEMETRY_DISABLED=1 npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Verify generated standalone output
        run: test -f .next/standalone/server.js

      - name: Verify SEO, sitemap, robots, canonical and indexability
        run: npm run seo:verify
        env:
          SEO_EXPECTED_SITE_URL: https://artistyaar.ir
