name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare environment
        env:
          ARTISTYAR_ENV_FILE: ${{ secrets.ARTISTYAR_ENV_FILE }}
        run: |
          printf '%s' "$ARTISTYAR_ENV_FILE" > .env.production
          chmod 600 .env.production

      - name: Install dependencies
        run: npm ci

      - name: OpenNext build
        run: npm run cf:build

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.135.0"
          command: deploy

      - name: Report deployment
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "Cloudflare deployment: $DEPLOYMENT_URL"
          else
            echo "Cloudflare deployment completed."
          fi

      - name: Remove environment file
        if: always()
        run: rm -f .env.production
